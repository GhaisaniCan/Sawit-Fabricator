<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Chemical mist: soft white cloud, tinted in game by the valve's chemical colour.
       Used both as a per-tile mist overlay and as the smoke particle texture. -->
  <defs>
    <radialGradient id="puff" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
    <circle cx="128" cy="132" r="92" fill="url(#puff)"/>
    <circle cx="84" cy="104" r="58" fill="url(#puff)"/>
    <circle cx="170" cy="96" r="52" fill="url(#puff)"/>
    <circle cx="168" cy="166" r="56" fill="url(#puff)"/>
    <circle cx="86" cy="170" r="50" fill="url(#puff)"/>
  </g>
  <!-- a few brighter droplets so the mist reads as chemical, not plain fog -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="104" cy="88" r="5"/>
    <circle cx="160" cy="140" r="4"/>
    <circle cx="120" cy="176" r="3.5"/>
    <circle cx="178" cy="92" r="3"/>
  </g>
</svg>
