<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Seed Embryo (Flora Nucleus): pristine seed germ, golden-green sap heart, leafy membranes, radial symmetry -->
  <defs>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#e9f5a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e9f5a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9e27e"/>
      <stop offset="1" stop-color="#5e9e3e"/>
    </linearGradient>
    <radialGradient id="seed" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.7" stop-color="#f3e3a6"/>
      <stop offset="1" stop-color="#c9ad5e"/>
    </radialGradient>
    <radialGradient id="sap" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset="0.45" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#b9820e"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <circle cx="128" cy="128" r="122" fill="url(#aura)"/>
  <!-- outer leafy membranes -->
  <g fill="url(#leaf)" stroke="#355f22" stroke-width="4" stroke-linejoin="round"><path transform="rotate(22.5 128 128)" d="M128,68 C158,40 146,18 128,12 C110,18 98,40 128,68 Z"/><path transform="rotate(67.5 128 128)" d="M128,68 C158,40 146,18 128,12 C110,18 98,40 128,68 Z"/><path transform="rotate(112.5 128 128)" d="M128,68 C158,40 146,18 128,12 C110,18 98,40 128,68 Z"/><path transform="rotate(157.5 128 128)" d="M128,68 C158,40 146,18 128,12 C110,18 98,40 128,68 Z"/><path transform="rotate(202.5 128 128)" d="M128,68 C158,40 146,18 128,12 C110,18 98,40 128,68 Z"/><path transform="rotate(247.5 128 128)" d="M128,68 C158,40 146,18 128,12 C110,18 98,40 128,68 Z"/><path transform="rotate(292.5 128 128)" d="M128,68 C158,40 146,18 128,12 C110,18 98,40 128,68 Z"/><path transform="rotate(337.5 128 128)" d="M128,68 C158,40 146,18 128,12 C110,18 98,40 128,68 Z"/></g>
  <g fill="none" stroke="#e2f5b8" stroke-width="2.5" opacity="0.7"><path transform="rotate(22.5 128 128)" d="M128,62 C128,43 128,30 128,24 C128,30 128,43 128,62"/><path transform="rotate(67.5 128 128)" d="M128,62 C128,43 128,30 128,24 C128,30 128,43 128,62"/><path transform="rotate(112.5 128 128)" d="M128,62 C128,43 128,30 128,24 C128,30 128,43 128,62"/><path transform="rotate(157.5 128 128)" d="M128,62 C128,43 128,30 128,24 C128,30 128,43 128,62"/><path transform="rotate(202.5 128 128)" d="M128,62 C128,43 128,30 128,24 C128,30 128,43 128,62"/><path transform="rotate(247.5 128 128)" d="M128,62 C128,43 128,30 128,24 C128,30 128,43 128,62"/><path transform="rotate(292.5 128 128)" d="M128,62 C128,43 128,30 128,24 C128,30 128,43 128,62"/><path transform="rotate(337.5 128 128)" d="M128,62 C128,43 128,30 128,24 C128,30 128,43 128,62"/></g>
  <!-- seed coat layers -->
  <circle cx="128" cy="128" r="72" fill="url(#seed)" stroke="#8a6e2c" stroke-width="5"/>
  <circle cx="128" cy="128" r="60" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.55"/>
  <circle cx="128" cy="128" r="50" fill="#f8eec4" opacity="0.6" stroke="#d8bf72" stroke-width="2.5"/>
  <!-- cotyledon ring -->
  <g fill="#9bd16a" stroke="#4a7d2e" stroke-width="2.5" opacity="0.9"><path transform="rotate(0 128 128)" d="M128,102 C140,91 135.2,86 128,80 C120.8,86 116,91 128,102 Z"/><path transform="rotate(60 128 128)" d="M128,102 C140,91 135.2,86 128,80 C120.8,86 116,91 128,102 Z"/><path transform="rotate(120 128 128)" d="M128,102 C140,91 135.2,86 128,80 C120.8,86 116,91 128,102 Z"/><path transform="rotate(180 128 128)" d="M128,102 C140,91 135.2,86 128,80 C120.8,86 116,91 128,102 Z"/><path transform="rotate(240 128 128)" d="M128,102 C140,91 135.2,86 128,80 C120.8,86 116,91 128,102 Z"/><path transform="rotate(300 128 128)" d="M128,102 C140,91 135.2,86 128,80 C120.8,86 116,91 128,102 Z"/></g>
  <!-- sap heart -->
  <circle cx="128" cy="128" r="30" fill="#f5c542" opacity="0.85" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="22" fill="url(#sap)" stroke="#8a5e08" stroke-width="3"/>
  <!-- tiny sprout -->
  <path d="M128,136 C128,126 128,122 128,116" stroke="#4a7d2e" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M128,118 C120,108 110,112 112,118 C116,122 124,122 128,118 Z" fill="#9bd16a" stroke="#4a7d2e" stroke-width="2"/>
  <path d="M128,118 C136,108 146,112 144,118 C140,122 132,122 128,118 Z" fill="#9bd16a" stroke="#4a7d2e" stroke-width="2"/>
  <circle cx="120" cy="134" r="4" fill="#ffffff" opacity="0.8"/>
</svg>
