<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Hazardous vine stem: same half-segment shape as vine_stem, armed with crimson thorns -->
  <defs>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b7d"/>
      <stop offset="0.45" stop-color="#b3122e"/>
      <stop offset="1" stop-color="#4d0614"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect x="112" y="106" width="146" height="44" rx="14" fill="#ff2a46" opacity="0.6" filter="url(#glow)"/>
  <!-- thorns -->
  <g fill="#ffd1d6" stroke="#3d0008" stroke-width="3" stroke-linejoin="round">
    <path d="M140,110 L150,76 L160,110 Z"/>
    <path d="M196,110 L206,78 L216,110 Z"/>
    <path d="M168,146 L178,180 L188,146 Z"/>
    <path d="M226,146 L236,178 L246,146 Z"/>
  </g>
  <rect x="112" y="108" width="146" height="40" rx="14" fill="url(#stem)" stroke="#3d0008" stroke-width="5"/>
  <path d="M120,128 C150,122 180,134 210,126 S250,128 258,128" fill="none" stroke="#2c43b8" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M122,116 H250" stroke="#ffc2ca" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
</svg>
