<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Cellulose Wall: thick organic cell wall block. Used for Wall tiles and Defensive Cell wall overlays -->
  <defs>
    <linearGradient id="cellulose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9ad55"/>
      <stop offset="0.55" stop-color="#8f7630"/>
      <stop offset="1" stop-color="#5c4a18"/>
    </linearGradient>
    <clipPath id="block">
      <rect x="8" y="8" width="240" height="240" rx="26"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="26" fill="url(#cellulose)"/>

  <!-- woven cellulose microfibrils -->
  <g clip-path="url(#block)" stroke-linecap="round" fill="none">
    <g stroke="#ecd98f" stroke-width="5" opacity="0.45">
      <path d="M-20,60 C40,40 80,90 140,66 S240,40 280,70"/>
      <path d="M-20,128 C40,108 80,158 140,134 S240,108 280,138"/>
      <path d="M-20,196 C40,176 80,226 140,202 S240,176 280,206"/>
    </g>
    <g stroke="#4a3a10" stroke-width="4" opacity="0.4">
      <path d="M60,-20 C40,40 90,80 66,140 S40,240 70,280"/>
      <path d="M190,-20 C170,40 220,80 196,140 S170,240 200,280"/>
    </g>
  </g>

  <!-- bevel and outline -->
  <rect x="16" y="16" width="224" height="224" rx="20" fill="none" stroke="#f3e2a2" stroke-width="3" opacity="0.5"/>
  <rect x="8" y="8" width="240" height="240" rx="26" fill="none" stroke="#3b300f" stroke-width="7"/>

  <!-- knots in the wall -->
  <g fill="#5c4a18" stroke="#3b300f" stroke-width="2">
    <ellipse cx="96" cy="100" rx="9" ry="6"/>
    <ellipse cx="168" cy="164" rx="10" ry="6.5"/>
  </g>
</svg>
