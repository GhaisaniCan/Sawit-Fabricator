<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Membrane Gate, OPEN: cellulose frame around a translucent green pore channel -->
  <defs>
    <linearGradient id="cyto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46d17f"/>
      <stop offset="1" stop-color="#1a8d50"/>
    </linearGradient>
    <linearGradient id="cellulose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9ad55"/>
      <stop offset="1" stop-color="#6e5a1f"/>
    </linearGradient>
    <radialGradient id="pore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#eaffd0" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#8dffb0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3fe08a" stop-opacity="0.15"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#cyto)"/>

  <!-- cellulose frame (the membrane anchor) -->
  <path fill="url(#cellulose)" stroke="#3b300f" stroke-width="5" fill-rule="evenodd"
        d="M10,10 H246 V246 H10 Z M42,42 V214 H214 V42 Z"/>
  <g fill="#3b300f">
    <circle cx="26" cy="26" r="5"/><circle cx="230" cy="26" r="5"/>
    <circle cx="26" cy="230" r="5"/><circle cx="230" cy="230" r="5"/>
  </g>

  <!-- open pore channel -->
  <circle cx="128" cy="128" r="74" fill="#7dffa8" opacity="0.5" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="68" fill="url(#pore)" stroke="#c8ffd8" stroke-width="4"/>
  <!-- retracted membrane petals at the rim -->
  <g fill="#2fa865" stroke="#0c5a30" stroke-width="2.5" opacity="0.9">
    <path d="M128,60 C138,68 138,78 128,84 C118,78 118,68 128,60 Z"/>
    <path d="M128,196 C138,188 138,178 128,172 C118,178 118,188 128,196 Z"/>
    <path d="M60,128 C68,118 78,118 84,128 C78,138 68,138 60,128 Z"/>
    <path d="M196,128 C188,118 178,118 172,128 C178,138 188,138 196,128 Z"/>
  </g>
  <circle cx="128" cy="128" r="10" fill="#ffffff" opacity="0.7"/>
</svg>
